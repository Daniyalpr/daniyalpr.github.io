project:
  type: website

website:
  title: "Math Playground"
  favicon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>"
  search: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: "🏠 Home"
      - href: problems.qmd
        text: "🧩 Problems"
      - href: topics.qmd
        text: "📚 Topics"
      - href: about.qmd
        text: "👋 About"
    tools:
      - icon: github
        href: https://github.com/daniyalpr
